<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="关于ZHEHAO - 了解我的故事和经历" />
    <!-- Favicon 支持 -->
    <link rel="icon" href="../favicon_1.ico" sizes="any"/>
    <link rel="icon" href="../favicon_1.ico" type="image/x-icon"/>
    <title>About Me</title>
    <style>
        /* ========== CSS Variables ========== */
        :root {
            /* 颜色系统 */
            --color-primary: #333;
            --color-secondary: #777;
            --color-bg: #f9f9f9;
            --color-white: #fff;
            --color-border: #eee;
            --color-text-light: #555;
            --color-text-lighter: #666;
            --color-shadow-light: rgba(0,0,0,0.05);

            /* 间距系统 */
            --spacing-sm: 10px;
            --spacing-md: 20px;
            --spacing-lg: 40px;
            --spacing-xl: 60px;

            /* 阴影系统 */
            --shadow-sm: 0 2px 5px var(--color-shadow-light);

            /* 字体大小 */
            --font-size-sm: 14px;
            --font-size-md: 24px;
            --font-size-lg: 28px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: var(--color-bg); color: var(--color-primary); }
        header { background: var(--color-white); padding: var(--spacing-md) var(--spacing-lg); box-shadow: var(--shadow-sm); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: var(--font-size-md); }
        nav ul { list-style: none; display: flex; gap: var(--spacing-md); }
        nav a { text-decoration: none; color: var(--color-primary); font-weight: 500; }
        nav a:hover { text-decoration: underline; }
        main { padding: var(--spacing-lg); max-width: 800px; margin: 0 auto; }
        h2 { font-size: var(--font-size-lg); margin-bottom: var(--spacing-md); }
        .memory-list { list-style: disc inside; color: var(--color-text-light); }
        .memory-list li { margin-bottom: var(--spacing-sm); }
        footer { margin-top: var(--spacing-xl); padding: var(--spacing-md); text-align: center; font-size: var(--font-size-sm); color: var(--color-text-lighter); border-top: 1px solid var(--color-border); }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--color-primary);
            padding: 5px;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav { position: relative; }
            .menu-toggle { display: block; }

            nav ul {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--color-white);
                flex-direction: column;
                gap: 0;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }

            nav ul.active {
                max-height: 400px;
                border-top: 1px solid var(--color-border);
            }

            nav ul li {
                border-bottom: 1px solid var(--color-border);
            }

            nav ul li:last-child {
                border-bottom: none;
            }

            nav ul li a {
                display: block;
                padding: 15px 20px;
            }

            main { padding: var(--spacing-md); }
            h2 { font-size: 24px; }
        }

        @media (max-width: 480px) {
            .logo { font-size: 20px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo">ZHEHAO</div>
        <button class="menu-toggle" id="menu-toggle" aria-label="切换菜单">&#9776;</button>
        <ul id="nav-menu">
            <li><a href="../index.html">Home</a></li>
            <li><a href="memory.html">Memory</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li><a href="footprint-map.html">Footprint Map</a></li>
            <li><a href="about-me.html">About me</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>
<main>
    <h2>About me</h2>
</main>
<footer>© ZHEHAO 2025</footer>

<script>
(function(){
    const menuToggle = document.getElementById('menu-toggle');
    const navMenu = document.getElementById('nav-menu');

    if (menuToggle && navMenu) {
        menuToggle.addEventListener('click', function() {
            navMenu.classList.toggle('active');
        });

        const menuLinks = navMenu.querySelectorAll('a');
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });

        document.addEventListener('click', function(e) {
            if (!menuToggle.contains(e.target) && !navMenu.contains(e.target)) {
                navMenu.classList.remove('active');
            }
        });
    }
})();
</script>
</body>
</html>
