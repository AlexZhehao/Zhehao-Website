        /* ========== CSS Variables ========== */
        :root {
            /* 颜色系统 */
            --color-primary: #333;
            --color-secondary: #777;
            --color-bg: #f9f9f9;
            --color-white: #fff;
            --color-border: #eee;
            --color-text-lighter: #666;
            --color-shadow-light: rgba(0,0,0,0.05);

            /* 间距系统 */
            --spacing-sm: 10px;
            --spacing-md: 20px;
            --spacing-lg: 40px;
            --spacing-xl: 60px;

            /* 阴影系统 */
            --shadow-sm: 0 2px 5px var(--color-shadow-light);

            /* 字体大小 */
            --font-size-sm: 14px;
            --font-size-md: 24px;
            --font-size-lg: 28px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: var(--color-bg); color: var(--color-primary); }
        header { background: var(--color-white); padding: var(--spacing-md) var(--spacing-lg); box-shadow: var(--shadow-sm); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: var(--font-size-md); }
        nav ul { list-style: none; display: flex; gap: var(--spacing-md); }
        nav a { text-decoration: none; color: var(--color-primary); font-weight: 500; }
        nav a:hover { text-decoration: underline; }
        main { padding: var(--spacing-lg); max-width: 800px; margin: 0 auto; }
        h2 { font-size: var(--font-size-lg); margin-bottom: var(--spacing-md); }
        .memory-list li { margin-bottom: var(--spacing-sm); }
        footer { margin-top: var(--spacing-xl); padding: var(--spacing-md); text-align: center; font-size: var(--font-size-sm); color: var(--color-text-lighter); border-top: 1px solid var(--color-border); }
