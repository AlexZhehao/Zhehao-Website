<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <!-- Favicon 支持 -->

  <!-- Apple Touch Icon (iOS/iPadOS) -->
  <link rel="apple-touch-icon" href="../favicon.ico"/>
  <title>San Diego</title>
  <style>
    /* ========== CSS Variables ========== */
    :root {
      /* 颜色系统 */
      --color-primary: #333;
      --color-secondary: #777;
      --color-bg: #f9f9f9;
      --color-white: #fff;
      --color-border: #eee;
      --color-overlay-dark: rgba(0,0,0,0.8);
      --color-shadow-light: rgba(0,0,0,0.05);
      --color-shadow-medium: rgba(0,0,0,0.1);

      /* 间距系统 */
      --spacing-md: 20px;
      --spacing-lg: 40px;

      /* 阴影系统 */
      --shadow-sm: 0 2px 5px var(--color-shadow-light);
      --shadow-md: 0 4px 10px var(--color-shadow-medium);

      /* 圆角 */
      --radius-sm: 4px;
      --radius-md: 8px;

      /* 字体大小 */
      --font-size-sm: 14px;
      --font-size-md: 24px;
      --font-size-xl: 40px;

      /* Gallery */
      --gallery-gap: 16px;
      --gallery-min-width: 250px;
      --gallery-img-height: 200px;
    }

    /* reset & layout */
    * { margin:0; padding:0; box-sizing:border-box }
    body { font-family:Arial,sans-serif; background:var(--color-bg); color:var(--color-primary) }
    header { background:var(--color-white); padding:var(--spacing-md) var(--spacing-lg); box-shadow:var(--shadow-sm) }
    nav { display:flex; justify-content:space-between; align-items:center }
    .logo { font-size:var(--font-size-md); font-weight:bold }
    nav ul { list-style:none; display:flex; gap:var(--spacing-md) }
    nav a { text-decoration:none; color:var(--color-primary); font-weight:500 }
    nav a:hover { text-decoration:underline }

    main {
      padding:var(--spacing-lg);
      max-width:900px;
      margin:0 auto;
    }
    h1 { margin-bottom:var(--spacing-md) }

    /* gallery grid */
    .gallery {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--gallery-min-width), 1fr));
      gap:var(--gallery-gap);
    }
    .gallery img {
      width:100%;
      height:var(--gallery-img-height);
      object-fit:cover;
      border-radius:var(--radius-md);
      cursor:pointer;
      box-shadow:var(--shadow-md);
      transition:transform .2s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }

    /* lightbox */
    .lightbox {
      display:none;
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      background: var(--color-overlay-dark);
      justify-content:center;
      align-items:center;
      padding:var(--spacing-md);
      z-index:1000;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius:var(--radius-sm);
      object-fit:contain;
    }
    .lightbox .close {
      position:absolute;
      top:var(--spacing-md);
      right:30px;
      font-size:var(--font-size-xl);
      color:var(--color-white);
      cursor:pointer;
    }

    footer {
      text-align:center;
      padding:var(--spacing-md);
      font-size:var(--font-size-sm);
      color:var(--color-secondary);
      border-top:1px solid var(--color-border);
      margin-top:var(--spacing-lg);
    }
  </style>
</head>
<body>

<header>
  <nav>
    <div class="logo">ZHEHAO</div>
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../Pages/memory.html">Memory</a></li>
      <li><a href="../Pages/videos.html">Videos</a></li>
      <li><a href="../Pages/footprint-map.html">Footprint Map</a></li>
      <li><a href="../Pages/about-me.html">About me</a></li>
      <li><a href="../Pages/contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>San Diego, USA</h1>
  <div class="gallery">
    <img src="../../Photos/加州best-1.jpg" alt="圣地亚哥海滩风景" width="250" height="200">
    <img src="../../Photos/加州best-2.jpg" alt="圣地亚哥海滩风景" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州best-3.jpg" alt="圣地亚哥海滩风景" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州美术馆.jpg" alt="圣地亚哥美术馆" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州海边2.jpg" alt="圣地亚哥海边" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州海边3.jpg" alt="圣地亚哥海边" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州海边4.jpg" alt="圣地亚哥海边" width="250" height="200" loading="lazy">
    <img src="../../Photos/海边女生生日.jpg" alt="海边生日庆祝" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州海边1.jpg" alt="圣地亚哥海边" width="250" height="200" loading="lazy">
    <img src="../../Photos/加州海岸二人.jpg" alt="圣地亚哥海岸" width="250" height="200" loading="lazy">

<footer>© ZHEHAO 2025</footer>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <div class="close" id="lightbox-close">&times;</div>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  (function() {
    // 检查必需元素
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbClose = document.getElementById('lightbox-close');
    const galleryImgs = document.querySelectorAll('.gallery img');

    if (!lightbox || !lbImg || !lbClose) {
      console.error('Lightbox: Required elements not found');
      return;
    }

    if (galleryImgs.length === 0) {
      console.warn('Gallery: No images found');
      return;
    }

    // 为每张图片添加点击事件和错误处理
    galleryImgs.forEach((img) => {
      // 图片加载失败处理
      img.onerror = function() {
        console.error(`Failed to load image: ${this.src}`);
        this.style.opacity = '0.3';
      };

      // 点击打开 lightbox
      img.addEventListener('click', () => {
        try {
          if (!img.src) {
            console.warn('No image source available');
            return;
          }
          lbImg.src = img.src;
          lightbox.style.display = 'flex';
        } catch(e) {
          console.error('Error opening lightbox:', e);
        }
      });
    });

    // 关闭 lightbox
    if (lbClose) {
      lbClose.addEventListener('click', () => {
        lightbox.style.display = 'none';
      });
    }

    if (lightbox) {
      lightbox.addEventListener('click', e => {
        if (e.target === lightbox) {
          lightbox.style.display = 'none';
        }
      });
    }

    // ESC 键关闭 lightbox
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.style.display === 'flex') {
        lightbox.style.display = 'none';
      }
    });
  })();
</script>

</body>
</html>
