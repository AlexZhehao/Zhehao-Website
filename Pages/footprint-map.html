<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="ZHEHAO的足迹地图 - 探索我走过的每个地方，记录旅行的美好瞬间" />
  <!-- Favicon 支持 -->
  <link rel="icon" href="../favicon_1.ico" sizes="any"/>
  <link rel="icon" href="../favicon_1.ico" type="image/x-icon"/>
  <title>Footprint Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    /* ========== CSS Variables ========== */
    :root {
      /* 颜色系统 */
      --color-primary: #333;
      --color-secondary: #888;
      --color-bg: #f8f8f8;
      --color-white: #fff;
      --color-border: #ddd;
      --color-border-light: #e0e0e0;
      --color-link: #0066cc;
      --color-shadow-light: rgba(0,0,0,0.05);

      /* 间距系统 */
      --spacing-md: 20px;
      --spacing-lg: 40px;
      --spacing-xl: 60px;

      /* 阴影系统 */
      --shadow-sm: 0 2px 5px var(--color-shadow-light);

      /* 字体大小 */
      --font-size-sm: 14px;
      --font-size-md: 24px;

      /* 圆角 */
      --radius-md: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-primary);
    }
    header {
      background: var(--color-white);
      box-shadow: var(--shadow-sm);
      padding: var(--spacing-md) var(--spacing-lg);
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo {
      font-weight: bold;
      font-size: var(--font-size-md);
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: var(--color-primary);
      font-weight: 500;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-bottom: var(--spacing-md);
    }
    #map {
      width: 100%;
      max-width: 1000px;
      height: 600px;
      border: 4px solid var(--color-border-light);
      border-radius: var(--radius-md);
    }
    footer {
      margin-top: var(--spacing-xl);
      padding: var(--spacing-lg) var(--spacing-md);
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-secondary);
      border-top: 1px solid var(--color-border);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--color-primary);
      padding: 5px;
    }

    @media (max-width: 768px) {
      header { padding: 15px 20px; }
      nav { position: relative; }
      .menu-toggle { display: block; }

      nav ul {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--color-white);
        flex-direction: column;
        gap: 0;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        z-index: 1000;
      }

      nav ul.active {
        max-height: 400px;
        border-top: 1px solid var(--color-border);
      }

      nav ul li {
        border-bottom: 1px solid var(--color-border);
      }

      nav ul li:last-child {
        border-bottom: none;
      }

      nav ul li a {
        display: block;
        padding: 15px 20px;
      }

      main {
        padding: 15px;
      }

      h2 {
        font-size: 20px;
        margin-bottom: 15px;
      }

      #map {
        height: 400px;
        border-width: 2px;
      }
    }

    @media (max-width: 480px) {
      .logo { font-size: 20px; }
      h2 { font-size: 18px; }
      #map { height: 350px; }
    }
  </style>
</head>
<body>

<header>
  <nav>
    <div class="logo">ZHEHAO</div>
    <button class="menu-toggle" id="menu-toggle" aria-label="切换菜单">&#9776;</button>
    <ul id="nav-menu">
      <li><a href="../index.html">Home</a></li>
      <li><a href="memory.html">Memory</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="footprint-map.html">Footprint Map</a></li>
      <li><a href="about-me.html">About me</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2>ZHEHAO 的足迹地图</h2>
  <div id="map"></div>
</main>

<footer>
  © ZHEHAO 2025
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Mobile Menu Toggle
  (function(){
    const menuToggle = document.getElementById('menu-toggle');
    const navMenu = document.getElementById('nav-menu');

    if (menuToggle && navMenu) {
      menuToggle.addEventListener('click', function() {
        navMenu.classList.toggle('active');
      });

      const menuLinks = navMenu.querySelectorAll('a');
      menuLinks.forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
        });
      });

      document.addEventListener('click', function(e) {
        if (!menuToggle.contains(e.target) && !navMenu.contains(e.target)) {
          navMenu.classList.remove('active');
        }
      });
    }
  })();

  // Map Initialization
  (function() {
    // 检查 Leaflet 库是否加载成功
    if (typeof L === 'undefined') {
      console.error('Leaflet library failed to load');
      const mapDiv = document.getElementById('map');
      if (mapDiv) {
        mapDiv.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">地图加载失败，请刷新页面重试</div>';
      }
      return;
    }

    // 检查地图容器是否存在
    const mapContainer = document.getElementById('map');
    if (!mapContainer) {
      console.error('Map container not found');
      return;
    }

    try {
      // 创建地图
      const map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        minZoom: 2,
        maxZoom: 8,
        maxBounds: [
          [-85, -180],
          [85, 180]
        ],
        maxBoundsViscosity: 1.0,
        worldCopyJump: false
      });

      // 添加地图图层
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        noWrap: true,
        bounds: [
          [-85, -180],
          [85, 180]
        ]
      }).addTo(map);

      // San Diego, CA 标记
      const sdMarker = L.marker([32.7157, -117.1611]).addTo(map);

      sdMarker.bindPopup(
        '<b>San Diego, USA</b><br>' +
        '<span id="sd-jump-link" style="color:#0066cc; text-decoration:underline; cursor:pointer;">点击进入</span>'
      );

      sdMarker.on('popupopen', () => {
        const link = document.getElementById('sd-jump-link');
        if (link) {
          link.onclick = () => {
            window.location.href = '../City/San-Diego.html';
          };
        }
      });

      // Halifax, Canada 标记
      const halifaxMarker = L.marker([44.645, -63.572]).addTo(map);

      halifaxMarker.bindPopup(
        '<b>Halifax, Canada</b><br>' +
        '<span id="halifax-jump-link" style="color:#0066cc; text-decoration:underline; cursor:pointer;">点击进入</span>'
      );

      halifaxMarker.on('popupopen', () => {
        const link = document.getElementById('halifax-jump-link');
        if (link) {
          link.onclick = () => {
            window.location.href = '../City/Halifax.html';
          };
        }
      });

      // China 标记
      L.marker([35.8617, 104.1954]).addTo(map)
        .bindPopup('<b>China</b><br><span style="color:#888;">暂时无法进入</span>');

    } catch (e) {
      console.error('Error initializing map:', e);
      if (mapContainer) {
        mapContainer.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">地图初始化失败</div>';
      }
    }
  })();
</script>

</body>
</html>
